<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Connext Media - 3D AI Team Office</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a12; color: #fff; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px; max-width: 320px; }
    #ui h1 { margin: 0 0 8px 0; font-size: 18px; color: #00d4ff; }
    button { margin: 4px; padding: 6px 12px; background: #00a8ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0088cc; }
    #statusList { margin-top: 10px; font-size: 12px; max-height: 200px; overflow-y: auto; }
    .bot-status { margin: 2px 0; }
    #btc { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; font-size: 14px; }
    #info { position: absolute; bottom: 10px; left: 10px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Connext Media Office</h1>
    <button id="dayNight">昼夜切换</button>
    <button id="demoMode">演示模式</button>
    <button id="resetView">重置视角</button>
    <div id="statusList"></div>
  </div>
  <div id="btc">BTC: 加载中...</div>
  <div id="info">拖拽旋转 | 滚轮缩放 | 手机双指操作<br>老板: Eldon (COO) | 主题: Connext Media</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
